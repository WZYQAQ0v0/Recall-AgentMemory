[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-session-atlas"
version = "0.3.0"
description = "Local searchable cards for AI coding conversations"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
recall = "recall.cli:main"

[tool.setuptools.packages.find]
include = ["recall*"]

[tool.setuptools.package-data]
recall = ["web/*"]
